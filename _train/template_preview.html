<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#0b1220;font-family:system-ui;color:#e5e7eb}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:10px}
.cell{background:#111a2e;border:1px solid #1f2b45;border-radius:10px;text-align:center;padding:6px}
.cell b{font-size:22px;color:#7dd3fc}
canvas{display:block;margin:2px auto;background:#0e1830;border-radius:8px}
</style></head><body>
<div class="grid" id="grid"></div>
<script>
const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function draw(cv, vec){
  const ctx=cv.getContext('2d'), W=cv.width, H=cv.height;
  ctx.clearRect(0,0,W,H);
  // points
  const pts=[]; for(let i=0;i<21;i++) pts.push([vec[2*i], vec[2*i+1]]);
  // fit: values are wrist-relative in ~[-1,1]; map to canvas with padding, y down
  const pad=18, scale=Math.min(W,H)/2 - pad;
  const cx=W/2, cy=H/2 + 10; // shift down a touch (wrist near bottom)
  const X=p=>cx + p[0]*scale, Y=p=>cy + p[1]*scale;
  ctx.strokeStyle='#38bdf8'; ctx.lineWidth=3; ctx.lineCap='round';
  for(const [a,b] of CONN){ ctx.beginPath(); ctx.moveTo(X(pts[a]),Y(pts[a])); ctx.lineTo(X(pts[b]),Y(pts[b])); ctx.stroke(); }
  for(let i=0;i<21;i++){ ctx.beginPath(); ctx.arc(X(pts[i]),Y(pts[i]), i===0?5:3, 0, 7); ctx.fillStyle=i===0?'#f59e0b':'#bae6fd'; ctx.fill(); }
}
(async()=>{
  const t=await (await fetch('../model/letter_templates.json')).json();
  const g=document.getElementById('grid');
  for(const L of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'){
    const d=document.createElement('div'); d.className='cell';
    d.innerHTML='<b>'+L+'</b>';
    const cv=document.createElement('canvas'); cv.width=150; cv.height=150;
    d.appendChild(cv); g.appendChild(d);
    if(t[L]) draw(cv,t[L]);
  }
  window.__done=true;
})();
</script></body></html>
